---
name: Terraform Azure Automation Account
license: "APACHE"
github_repo: terraform-az-modules/terraform-azurerm-automation-account
badges:
  - name: "Terraform"
    image: "https://img.shields.io/badge/Terraform-%3E%3D1.6.6-green"
    url: "https://www.terraform.io"
  - name: "Licence"
    image: "https://img.shields.io/badge/License-APACHE-blue.svg"
    url: "LICENSE"
prerequesties:
  - name: Terraform
    url: https://developer.hashicorp.com/terraform
    version: ">= 1.6.6"
providers:
  - name: azurerm
    url: https://registry.terraform.io/providers/hashicorp/azurerm/latest
    version: ">= 5.4.0"
description: |-
  Reusable Terraform module for an Azure Automation Account and all Automation child
  resources supported by AzureRM, with strongly typed optional maps, managed identities,
  CMK encryption, networking controls, sensitive-value handling, and timeouts.
usage: |-
  ```hcl
  module "automation_account" {
    source = "terraform-az-modules/automation-account/azurerm"

    name                = "aa-app-prod-001"
    resource_group_name = "rg-app-prod"
    location            = "West Europe"

    identity = {
      type = "SystemAssigned"
    }

    local_authentication_enabled  = false
    public_network_access_enabled = false
    tags = { environment = "prod" }
  }
  ```
